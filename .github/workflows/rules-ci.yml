# Rules-only CI for the Firestore security rules PR (firestore.rules v3).
# - Runs tests/rules.test.js against the LOCAL Firestore emulator only, with the demo
#   project "demo-strangepin" (the "demo-" prefix means no real project can be reached).
#   It never touches production Firebase, EmailJS or Cloudinary.
# - No secrets, no deploy steps, read-only token.
# - The job is named "tests" because the main branch ruleset requires a check with that name.
#   Test dependencies live in tests/package.json (CI-only); there is no root package.json,
#   so Netlify's build/publish behaviour for main is not affected.
name: Rules CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies (tests/package-lock.json)
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Firestore rules v3 (emulator only, demo project)
        run: >
          ./tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-strangepin
          "node tests/rules.test.js"
